server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /saglik {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Fixed upstream: no admin credential or API secret is placed in the image.
    location /api/ {
        proxy_pass https://api.kadomoda.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.kadomoda.com;
        proxy_ssl_verify on;
        # The API chain includes YR1 and cross-signed Root YR before ISRG Root X1.
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.kadomoda.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
